<style>:root {
  --bg: #05060d;
  --panel: rgba(9, 11, 30, 0.86);
  --line: rgba(143, 123, 255, 0.45);
  --blue: #27d7ff;
  --purple: #b45cff;
  --coin: #ffd23f;
  --hazard: #ff3355;
  --perfect: #7dffb2;
  --text: #f2f4ff;
  --muted: #a7aed8;
  --u: 2px; 
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body {
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  color: var(--text);
  user-select: none; -webkit-user-select: none;
  touch-action: none;
  overscroll-behavior: none;
}
#app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 640px; height: 360px; overflow: hidden; background: #070926; box-shadow: 0 0 0 1px #151a3a, 0 20px 80px rgba(0,0,0,.6); }
#screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

.hidden { display: none !important; }


.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 4);
  padding: calc(var(--u) * 10) calc(var(--u) * 10);
  background: linear-gradient(180deg, rgba(5,6,13,.55), rgba(5,6,13,.25) 40%, rgba(5,6,13,.7));
  animation: fadeIn .18s ease-out;
  overflow-y: auto;
  touch-action: pan-y;
}
#home, #over { flex-direction: row; align-items: stretch; justify-content: center; gap: calc(var(--u) * 10); padding: calc(var(--u) * 8) calc(var(--u) * 14); }
#home { background: linear-gradient(90deg, rgba(5,6,13,.78), rgba(5,6,13,.45) 50%, rgba(5,6,13,.78)); }
.col { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: calc(var(--u) * 4); min-width: 0; }
.homeL { flex: 1.05; }
.homeR, .overL { flex: 0.95; }
#over { background: rgba(5,6,13,.9); }
#pause, #skins, #ach, #howto, #settings { background: rgba(5,6,13,.9); justify-content: flex-start; padding: calc(var(--u) * 8) calc(var(--u) * 40); }
#pause { justify-content: center; padding: calc(var(--u) * 8) calc(var(--u) * 90); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

#logo { width: calc(var(--u) * 120); height: calc(var(--u) * 44); image-rendering: pixelated; filter: drop-shadow(0 calc(var(--u)*2) 0 rgba(0,0,0,.6)); }
.tagline { margin: 0; font-weight: 800; font-size: calc(var(--u) * 7.2); text-align: center; text-shadow: 0 2px 0 #000; }
.lvl { display: flex; align-items: center; gap: calc(var(--u) * 3); width: 80%; font-size: calc(var(--u) * 6); }
.lvl b { color: var(--perfect); white-space: nowrap; }
.bar { flex: 1; height: calc(var(--u) * 3); background: rgba(255,255,255,.12); border-radius: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--purple)); }
.missions { width: 100%; display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.missions:empty { display: none; }
.mis { display: flex; align-items: center; gap: calc(var(--u) * 3); font-size: calc(var(--u) * 5.2); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 1.2) calc(var(--u) * 3); }
.mis .t { flex: 1; line-height: 1.25; }
.mis .bar { flex: none; width: calc(var(--u) * 24); }
.mis .r { color: var(--coin); font-weight: 900; white-space: nowrap; }
.mis.done { border-color: rgba(125,255,178,.5); }
.mis.done .t { color: var(--perfect); }
.mis-h { font-size: calc(var(--u) * 5.2); color: var(--muted); font-weight: 800; }
.xpline { font-size: calc(var(--u) * 5.6); color: var(--perfect); font-weight: 800; }
.xpline:empty { display: none; }
#rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #05060d; color: #fff; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; font-weight: 900; font-size: 22px; }
#rotate small { color: var(--muted); font-size: 15px; }
#rotate .phone { width: 46px; height: 80px; border: 5px solid var(--blue); border-radius: 10px; animation: rot 1.6s ease-in-out infinite; }
@keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); border-color: var(--purple); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
.bestline { font-size: calc(var(--u) * 6.4); color: var(--muted); }
.bestline b { color: var(--text); }
.coinIcon { display: inline-block; width: calc(var(--u) * 5); height: calc(var(--u) * 6); background: var(--coin); box-shadow: inset calc(var(--u)*-1) 0 0 #a8740a, inset calc(var(--u)*1) 0 0 #fff6c2; border-radius: 2px; vertical-align: middle; }
.tapnote { margin: 0; font-size: calc(var(--u) * 5); color: var(--muted); opacity: .8; }

h2 { margin: 0; font-size: calc(var(--u) * 10); font-weight: 900; letter-spacing: .5px; text-shadow: 0 3px 0 #000; }

.btn {
  font-family: inherit; font-weight: 800; color: var(--text);
  font-size: calc(var(--u) * 7.4);
  min-height: calc(var(--u) * 19);
  width: 100%;
  padding: calc(var(--u) * 2) calc(var(--u) * 4);
  background: linear-gradient(180deg, #2a2560, #1a1642);
  border: calc(var(--u) * 1) solid #4a3f99;
  border-bottom-width: calc(var(--u) * 2.5);
  border-radius: calc(var(--u) * 3);
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
  transition: transform .06s;
}
.btn:active { transform: translateY(2px); border-bottom-width: calc(var(--u) * 1); }
.btn small { font-size: calc(var(--u) * 5); color: var(--muted); font-weight: 600; }
.btn.big {
  font-size: calc(var(--u) * 10.5);
  min-height: calc(var(--u) * 27);
  background: linear-gradient(180deg, #ff6a48, #e2402a);
  border-color: #7a1d12;
  text-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.btn.ghost { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.15); }
.btn.on, .btn.equipped { background: linear-gradient(180deg, #146b6e, #0c4b55); border-color: var(--blue); }
.btn:disabled { opacity: .45; }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.03); } }
.row { display: flex; gap: calc(var(--u) * 4); width: 100%; }
.row.small .btn { font-size: calc(var(--u) * 6); min-height: calc(var(--u) * 16); }

#pauseBtn {
  position: absolute; top: calc(var(--u) * 3); left: calc(var(--u) * 3);
  width: calc(var(--u) * 18); height: calc(var(--u) * 18);
  background: rgba(5,6,13,.5); border: calc(var(--u)*1) solid rgba(255,255,255,.25); border-radius: calc(var(--u)*2);

!</b> Everything after it comes faster for a bit",pop:"<b>Pop spikes</b> spring out on a beat and shake first — read them, flip only if needed",saw:"A <b>buzzsaw</b> rolls back and forth — watch where it is",orbit:"<b>Orbiting ball</b> mid-air — time your flip through the ring",pend:"<b>Pendulum</b> skims just over the floor — running under is safe, flipping near it is not",blink:"A bridge that <b>blinks</b> in and out — gems for the brave",fly:'<b style="color:#ffb000">FLY!</b> <b>Hold</b> to rise, let go to fall — thread the tunnel',rift:'<b style="color:#ff5ae0">✦ SECRET RIFT!</b> Flip up into it — a short bonus world full of gold. Crash inside and you just return to the run',piston:"<b>Pistons</b> slam out and fill their whole lane — stay in the <b>other lane</b>",jaws:"<b>Jaws</b> slam top and bottom in turn — watch which one glows and flip to the safe side",geyser:'<b style="color:#ff8a3a">Geysers</b> erupt fire — flip over each vent, then back between the spikes',firebar:'A <b style="color:#ff9a3c">firebar</b> spins — pass when the arm is away from your lane',snake:'The <b style="color:#27d7ff">electric snake</b> ripples — slip through where the wave isn\'t',meteor:'<b style="color:#ff5a6e">Meteors</b> drop from the ceiling — the red column warns you first',bouncer:'The <b style="color:#ff5ad1">bouncer</b> ricochets everywhere — watch where it\'s heading',wind:'<b style="color:#ffc23a">Wind!</b> A TAILWIND carries you faster — the taps come quicker. A HEADWIND holds you back — the spikes sit closer',float:'<b style="color:#3fdc7a">FLOAT</b>: weak gravity — slow flips, <b>tap early</b>',heavy:'<b style="color:#ff6a1a">HEAVY</b>: strong gravity — snappy flips, quick taps',totem:'A <b style="color:#7aff6a">totem</b> flips you by itself! Spikes on the side it throws you to: <b>tap</b>. On the side you left: <b>don\'t</b>'}},i={ar:{spike_floor:"أشواك الأرض — قلبتك جت متأخرة عن آخر لحظة آمنة. القلبة المتأخرة بتجيب NERVE، بس العلامات الخضراء بتوريك آخر لحظة.",spike_
