<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>FLIPNOVA prototype: PALE NIRO boss level</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated}
</style></head><body>
<canvas id="c"></canvas>
<script>
// PROTOTYPE (throwaway). Question: is a hand-made 60-second boss level fun, where your close dodges hit the boss?
// One button. Running: tap = flip gravity. Flying: tap = switch between going up and going down (walls are safe).
// Act 1 THE CHASE · Act 2 THE CAVE-IN (flight) · Act 3 THE FALL (gravity gates, then three knocks through light gates).
// Dying restarts the act at once. Press D for hitboxes.
'use strict';
const W = 320, H = 180, C = 36, F = 156, PX = 64, PS = 12, G = 2600, MAXV = 460, KICK = 60, SIMX = 1.25;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const g = buf.getContext('2d');
let SC = 1;
function fit() { const dpr = Math.min(2, devicePixelRatio || 1), w = Math.min(innerWidth, innerHeight * W / H), h = w * H / W; cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); SC = cv.width / W; }
addEventListener('resize', fit); fit();
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const cl = (v, a, b) => Math.max(a, Math.min(b, v)), hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const AR = /^ar/i.test(navigator.language || '');
const TXT = (en, ar) => (AR ? ar : en);

// ---------------- sound (tiny, dry, short)
let ac = null;
function snd(kind) {
  if (!ac) return; const t = ac.currentTime;
  const nz = (f, q, dur, vol, type, f1, delay) => { const b = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(); s.buffer = b; const fl = ac.createBiquadFilter(); fl.type = type || 'bandpass'; fl.Q.value = q; fl.frequency.setValueAtTime(f, t + (delay || 0)); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + (delay || 0) + dur); const gn = ac.createGain(); gn.gain.setValueAtTime(vol, t + (delay || 0)); gn.gain.exponentialRampToValueAtTime(0.001, t + (delay || 0) + dur); s.connect(fl); fl.connect(gn); gn.connect(ac.destination); s.start(t + (delay || 0)); };
  const th = (f0, f1, dur, vol, delay) => { const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.setValueAtTime(f0, t + (delay || 0)); o.frequency.exponentialRampToValueAtTime(f1, t + (delay || 0) + dur); gn.gain.setValueAtTime(vol, t + (delay || 0)); gn.gain.exponentialRampToValueAtTime(0.001, t + (delay || 0) + dur); o.connect(gn); gn.connect(ac.destination); o.start(t + (delay || 0)); o.stop(t + (delay || 0) + dur + 0.02); };
  if (kind === 'flip') { nz(900, 2, 0.08, 0.25, 'bandpass', 2400); }
  if (kind === 'close') { nz(3000, 1, 0.12, 0.35, 'bandpass', 800); th(220, 90, 0.12, 0.35, 0.03); }
  if (kind === 'die') { nz(1200, 0.7, 0.3, 0.5, 'lowpass', 200); th(140, 40, 0.3, 0.5); }
  if (kind === 'slam') { th(110, 35, 0.4, 0.7); nz(800, 0.8, 0.35, 0.5, 'lowpass', 120); }
  if (kind === 'knock') { nz(330, 12, 0.09, 1.6); nz(860, 10, 0.06, 1.0); th(180, 95, 0.09, 0.4); }
  if (kind === 'hit') { th(160, 40, 0.5, 0.7); nz(2500, 0.7, 0.4, 0.5, 'lowpass', 200); }
  if (kind === 'portal') { nz(400, 2, 0.4, 0.35, 'bandpass', 4000); }
}

// ---------------- the level: authored by hand, act by act (x in world px)
// o: { t: 'spike'|'block'|'fist'|'gate'|'flip'|'knockGate', x, side: 'f'|'c', w, h, y (flight gates: gap centre), gap }
const ACTS = [];
(function author() {
  // ACT 1 — THE CHASE: teach one thing at a time, then combine (spikes → blocks → fists → rhythm → squeeze)
  const a = []; const sp = (x, side) => a.push({ t: 'spike', x, side }); const bl = (x, side, w, h) => a.push({ t: 'block', x, side, w, h }); const fi = (x, side) => a.push({ t: 'fist', x, side });
  sp(520, 'f'); sp(760, 'c'); sp(980, 'f'); sp(1000, 'f');
  bl(1240, 'f', 22, 38); sp(1330, 'c');
  fi(1600, 'f'); fi(1880, 'c');
  [2100, 2175, 2250, 2325].forEach((x, i) => sp(x, i % 2 ? 'c' : 'f'));
  bl(2560, 'f', 18, 50); bl(2660, 'c', 18, 50); bl(2760, 'f', 18, 50);
  fi(3000, 'f'); sp(3060, 'c'); fi(3220, 'c');
  [3420, 3480, 3540].forEach((x, i) => sp(x, i % 2 ? 'c' : 'f'));
  ACTS.push({ name: 'ACT 1 · THE CHASE', ar: 'الفصل ١ · المطاردة', len: 3800, speed: 170, mode: 'run', col: '#ff8a3a', bg: ['#14040a', '#3a0c0a', '#7a2a0c'], objs: a, hint: [TXT('TAP = FLIP', 'اضغط = اقلب'), TXT('pass CLOSE to dangers to hit him', 'عدّي قريب من الخطر عشان تضربه')] });
  // ACT 2 — THE CAVE-IN: easy flight. Gates are pairs of rock columns with a gap; walls are safe.
  const b = []; const gate = (x, y, gap) => b.push({ t: 'gate', x, y, gap, w: 16 });
  gate(420, 96, 80); gate(620, 70, 76); gate(820, 122, 72);
  [1040, 1200, 1360, 1520].forEach((x, i) => gate(x, [66, 126, 80, 118][i], 60));
  b.push({ t: 'fist', x: 1700, side: 'c', fly: 1 }); gate(1860, 120, 56);
  [2040, 2180, 2320, 2460].forEach((x, i) => gate(x, [70, 124, 64, 116][i], 52));
  b.push({ t: 'fist', x: 2620, side: 'f', fly: 1 }); gate(2780, 80, 56);
  ACTS.push({ name: 'ACT 2 · THE CAVE-IN', ar: 'الفصل ٢ · الانهيار', len: 3050, speed: 160, mode: 'fly', col: '#3affe8', bg: ['#050010', '#0c0424', '#1a0838'], objs: b, hint: [TXT('FLYING: TAP = UP / DOWN', 'طيران: اضغط = طلوع / نزول'), TXT('the walls are safe · follow the dotted line', 'الحيطان آمنة · امشي ورا الخط المنقّط')] });
  // ACT 3 — THE FALL: gravity gates flip you by themselves; then three light gates in alternating lanes = three knocks
  const c = []; const sp3 = (x, side) => c.push({ t: 'spike', x, side });
  sp3(400, 'f'); c.push({ t: 'flip', x: 620 }); sp3(760, 'c'); sp3(900, 'f');
  c.push({ t: 'flip', x: 1100 }); sp3(1180, 'f'); sp3(1300, 'c');
  [1500, 1600, 1700, 1800].forEach((x, i) => sp3(x, i % 2 ? 'f' : 'c'));
  c.push({ t: 'fist', x: 1990, side: 'f' }); c.push({ t: 'flip', x: 2120 }); sp3(2240, 'f');
  c.push({ t: 'block', x: 2350, side: 'c', w: 20, h: 54 }); c.push({ t: 'block', x: 2470, side: 'f', w: 20, h: 54 });
  c.push({ t: 'knockGate', x: 2700, side: 'f', n: 1 }); sp3(2720, 'c');
  c.push({ t: 'knockGate', x: 2860, side: 'c', n: 2 }); sp3(2880, 'f');
  c.push({ t: 'knockGate', x: 3020, side: 'f', n: 3 }); sp3(3040, 'c');
  ACTS.push({ name: 'ACT 3 · THE FALL', ar: 'الفصل ٣ · السقوط', len: 3300, speed: 205, mode: 'run', col: '#ff3aa8', bg: ['#000610', '#001a3a', '#00507a'], objs: c, hint: [TXT('PINK GATES FLIP YOU', 'البوابات الوردي بتقلبك'), TXT('go through the 3 light gates: KNOCK!', 'عدّي من التلات بوابات المنوّرة: دُق!')] });
})();

// ---------------- state
const S = { act: 0, x: 0, y: F - PS, vy: 0, grav: 1, grounded: true, dead: 0, deaths: [0, 0, 0], closes: 0, hp: 100, t: 0, real: 0, slow: 0, shake: 0, flash: 0, flashC: '#fff', state: 'title', stT: 0, fly: false, up: false, parts: [], pops: [], knocks: 0, bolts: [], lastFlip: -9, debug: false, hits: [] };
const ACT_HP = [30, 30, 40]; // what surviving each act takes off him (closes add more on top)
function startAct(i, fresh) {
  const A = ACTS[i]; S.act = i; S.x = 0; S.t = 0; S.vy = 0; S.grav = 1; S.grounded = true; S.fly = A.mode === 'fly'; S.up = false;
  S.y = S.fly ? 90 : F - PS; S.state = 'intro'; S.stT = 0; S.knocks = 0; S.bolts = []; S.pops = []; S.lastFlip = -9; // (a restart never blocks the first flip)
  for (const o of A.objs) { o.done = 0; o.fired = 0; o.close = 0; o.hit = 0; }
  if (fresh) S.hpAct = S.hp;
  S.hp = S.hpAct;
}
function tap() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* */ } }
  if (S.state === 'title') { startAct(0, true); return; }
  if (S.state === 'end') { if (S.real - S.endT > 1.2) { S.hp = 100; S.closes = 0; S.deaths = [0, 0, 0]; startAct(0, true); } return; }
  if (S.state === 'intro' && S.stT > 0.3) { S.state = 'play'; }
  if (S.state !== 'play') return;
  if (S.fly) { S.up = !S.up; snd('flip'); return; }
  if (S.t - S.lastFlip < 0.06) return;
  S.grav = -S.grav; if (S.grounded) S.vy = S.grav * KICK; S.grounded = false; S.lastFlip = S.t; snd('flip');
  burst(PX + 6, S.y + 6, [ACTS[S.act].col, '#fff'], 5, 60);
}
addEventListener('pointerdown', (e) => { e.preventDefault(); tap(); }, { passive: false });
addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); tap(); } if (e.code === 'KeyD') S.debug = !S.debug; });

function burst(x, y, cols, n, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = sp * (0.4 + Math.random()); S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.4, c: cols[i % cols.length] }); } }
function pop(text, x, y, col, big) { S.pops.push({ text, x, y, col, t: S.real, big }); }

// hitboxes in world coords (for the act being played)
function boxes(o) {
  if (o.t === 'spike') return [[o.x + 3, o.side === 'f' ? F - 10 : C, 8, 10]];
  if (o.t === 'block') return [[o.x, o.side === 'f' ? F - o.h : C, o.w, o.h]];
  if (o.t === 'gate') return [[o.x, C, o.w, o.y - o.gap / 2 - C], [o.x, o.y + o.gap / 2, o.w, F - (o.y + o.gap / 2)]];
  if (o.t === 'fist') { const d = fistPhase(o); if (d.on) return o.fly ? [[o.x - 6, o.side === 'c' ? C : F - 70, 44, 70]] : [[o.x - 4, o.side === 'f' ? F - 38 : C, 40, 38]]; }
  return [];
}
// a fist slams when the hero is 70 px away (warned from 300 px), and stays down for 0.35 s
function fistPhase(o) { const dx = o.x - (S.x + PX); const warn = dx < 300 && dx > -60, slamAt = 70; const k = cl((300 - dx) / (300 - slamAt), 0, 1); return { warn, k, on: dx <= slamAt && dx > -50 }; }

function step(dt) {
  const A = ACTS[S.act];
  if (S.state !== 'play') return;
  S.t += dt; S.x += A.speed * dt;
  // the hero
  if (S.fly) { S.vy = (S.up ? -1 : 1) * 135; S.y += S.vy * dt; if (S.y < C) S.y = C; if (S.y > F - PS) S.y = F - PS; }
  else {
    S.vy = cl(S.vy + G * S.grav * dt, -MAXV, MAXV); S.y += S.vy * dt; S.grounded = false;
    if (S.y >= F - PS) { S.y = F - PS; S.vy = 0; S.grounded = S.grav > 0; if (S.grav < 0) S.grounded = false; }
    if (S.y <= C) { S.y = C; S.vy = 0; S.grounded = S.grav < 0; }
  }
  const hx = S.x + PX;
  // objects
  for (const o of A.objs) {
    if (o.x > hx + 400 || o.x < hx - 200) continue;
    if (o.t === 'fist' && !o.fired && fistPhase(o).on) { o.fired = 1; snd('slam'); S.shake = Math.max(S.shake, 0.4); burst(o.x - S.x + 16, o.side === 'f' ? F : C, ['#e8f1ff', '#888', A.col], 14, 120); }
    if (o.t === 'flip' && !o.done && hx >= o.x) { o.done = 1; S.grav = -S.grav; S.grounded = false; S.vy = S.grav * KICK; snd('portal'); S.flash = 0.5; S.flashC = '#ff3aa8'; burst(PX + 6, S.y + 6, ['#ff3aa8', '#fff'], 14, 110); }
    if (o.t === 'knockGate' && !o.done && hx >= o.x) { o.done = 1; const inLane = o.side === 'f' ? S.y > MIDY() : S.y < MIDY(); if (inLane) { S.knocks++; snd('knock'); hitBoss(8, 'KNOCK ' + o.n + '!'); S.flash = 0.6; S.flashC = '#ffe9a0'; } }
    for (const b of boxes(o)) {
      if (overlap(hx + 1, S.y + 1, PS - 2, PS - 2, b)) { die(); return; }
      // close calls: measured while the hero is beside the danger, paid when it is behind
      if (b[0] < hx + PS && b[0] + b[2] > hx) { const gap = Math.max(b[1] - (S.y + PS), S.y - (b[1] + b[3])); if (gap >= 0) o.close = Math.max(o.close || 0, gap < 4 ? 2 : gap < 10 ? 1 : 0); }
    }
    if (!o.hit && o.close && o.x + (o.w || 14) < hx) { o.hit = 1; const big = o.close === 2; S.closes++; S.slow = Math.max(S.slow, big ? 0.16 : 0.08); snd('close'); pop(big ? 'SO CLOSE!' : 'CLOSE!', PX + 6, S.y - 6, big ? '#ffe9a0' : '#ffffff'); S.bolts.push({ x: PX + 6, y: S.y + 6, t: S.real, dmg: big ? 3 : 1.5 }); burst(PX + 6, S.y + 6, ['#ffe9a0', A.col, '#fff'], big ? 14 : 7, 100); }
  }
  // bolts fly to him
  for (const b of S.bolts) if (!b.done && S.real - b.t > 0.35) { b.done = 1; hitBoss(b.dmg); }
  if (S.x >= A.len) { // act cleared: the scripted big hit
    S.state = 'clear'; S.stT = 0; hitBoss(ACT_HP[S.act] * 0.5, S.act === 2 ? '' : 'ACT CLEAR'); S.flash = 1; S.flashC = A.col; S.shake = 0.5; snd('hit');
  }
}
const MIDY = () => (C + F) / 2 - PS / 2;
function overlap(x, y, w, h, b) { return x < b[0] + b[2] && x + w > b[0] && y < b[1] + b[3] && y + h > b[1]; }
function hitBoss(d, label) { S.hp = Math.max(1, S.hp - d); S.hits.push(S.real); if (label) pop(label, 250, 60, '#ffe9a0', true); S.shake = Math.max(S.shake, 0.2); }
function die() { S.deaths[S.act]++; S.state = 'dead'; S.stT = 0; snd('die'); S.flash = 0.7; S.flashC = '#ff3a5a'; S.shake = 0.6; burst(PX + 6, S.y + 6, ['#ff3a5a', '#fff', '#b5532a'], 24, 160); }

// ---------------- drawing
function sky(A) { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, A.bg[0]); gr.addColorStop(0.6, A.bg[1]); gr.addColorStop(1, A.bg[2]); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function world(A) {
  sky(A);
  const sx = S.x;
  for (let i = 0; i < 14; i++) { const x = ((i * 61 - sx * 0.2) % 380 + 380) % 380 - 30; R(x, C + 10 + hash(i) * 90, 18 + hash(i + 3) * 30, 70, 'rgba(0,0,0,0.25)'); }
  for (let i = 0; i < 30; i++) { const x = ((i * 37 - sx * 0.5) % 340 + 340) % 340 - 10, y = C + 6 + hash(i + 9) * (F - C - 12); R(x, y, 2, 2, A.col + '55'); }
  R(0, 0, W, C, '#0a0610'); R(0, C - 2, W, 2, A.col); R(0, F, W, H - F, '#0a0610'); R(0, F, W, 2, A.col);
  for (let x = -((sx) % 16); x < W; x += 16) { R(x, F + 4, 8, 2, 'rgba(255,255,255,0.08)'); R(x + 8, C - 6, 8, 2, 'rgba(255,255,255,0.08)'); }
}
function niro(A) { // the brother: a pale face — behind you in the chase, ahead of you in the cave and the fall
  const t = S.real, behind = S.act === 0, x = behind ? -46 + Math.sin(t * 2) * 4 + (S.state === 'dead' ? 30 : 0) : 238, y = 52 + Math.sin(t * 1.3) * 4;
  const hurt = S.hits.length && t - S.hits[S.hits.length - 1] < 0.15;
  R(x, y, 70, 64, hurt ? '#ffffff' : '#b9c4cc'); R(x + 64, y, 6, 64, '#8b98a3'); R(x - 4, y - 8, 78, 16, '#0e1018'); R(x - 4, y + 10, 78, 5, '#7f8a96');
  const ex = [x + 12, x + 42]; ex.forEach((e) => { R(e, y + 28, 16, 9, '#fff'); g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(e + 8, y + 32, 0, e + 8, y + 32, 12); gr.addColorStop(0, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(e - 14, y + 10, 44, 44); g.restore(); });
  R(x + 22, y + 50, 26, 3, '#3a2a2a'); g.save(); g.translate(x + 20, y + 24); g.rotate(0.3); g.fillStyle = '#0e1018'; g.fillRect(-9, -1.5, 18, 3); g.restore(); g.save(); g.translate(x + 50, y + 24); g.rotate(-0.3); g.fillStyle = '#0e1018'; g.fillRect(-9, -1.5, 18, 3); g.restore();
  if (behind) { g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createLinearGradient(0, 0, 60, 0); gr.addColorStop(0, A.col + '66'); gr.addColorStop(1, A.col + '00'); g.fillStyle = gr; g.fillRect(0, C, 60, F - C); g.restore(); }
}
function objs(A) {
  for (const o of A.objs) {
    const x = o.x - S.x; if (x < -80 || x > W + 60) continue;
    if (o.t === 'spike') { g.fillStyle = '#e8f1ff'; g.beginPath(); if (o.side === 'f') { g.moveTo(x, F); g.lineTo(x + 7, F - 13); g.lineTo(x + 14, F); } else { g.moveTo(x, C); g.lineTo(x + 7, C + 13); g.lineTo(x + 14, C); } g.fill(); g.fillStyle = A.col; g.fillRect(x, o.side === 'f' ? F - 2 : C, 14, 2); }
    if (o.t === 'block') { const y = o.side === 'f' ? F - o.h : C; R(x, y, o.w, o.h, '#2a3140'); R(x, y, o.w, 2, A.col); R(x, y, 2, o.h, '#3c4558'); }
    if (o.t === 'gate') { const top = o.y - o.gap / 2, bot = o.y + o.gap / 2; R(x, C, o.w, top - C, '#2a1a3a'); R(x, bot, o.w, F - bot, '#2a1a3a'); R(x, top - 3, o.w, 3, A.col); R(x, bot, o.w, 3, A.col); R(x + 2, C, 2, top - C, '#4a2a6a'); R(x + 2, bot, 2, F - bot, '#4a2a6a'); }
    if (o.t === 'fist') {
      const d = fistPhase(o), up = o.side === 'c';
      if (d.warn && !d.on) { g.fillStyle = 'rgba(255,58,90,' + (0.15 + 0.35 * d.k).toFixed(2) + ')'; if (o.fly) g.fillRect(x - 6, up ? C : F - 70, 44, 70); else g.fillRect(x - 4, up ? C : F - 3, 40, 3); }
      const fy = d.on ? 0 : (1 - d.k) * 90; if (d.warn || d.on) { const y = up ? (o.fly ? C : C) - fy : (o.fly ? F - 70 : F - 38) + fy; if (!up) { R(x, y - 60, 32, 60, '#1c212d'); } else { R(x, y + (o.fly ? 70 : 38), 32, 60, '#1c212d'); } R(x - 4, y, 40, o.fly ? 70 : 38, '#b9c4cc'); for (let i = 0; i < 4; i++) R(x - 2 + i * 10, up ? y + (o.fly ? 62 : 30) : y, 8, 8, '#e3ebf0'); }
    }
    if (o.t === 'flip') { g.strokeStyle = '#ff3aa8'; g.lineWidth = 3; g.beginPath(); g.ellipse(x + 4, (C + F) / 2, 6, (F - C) / 2 - 4, 0, 0, Math.PI * 2); g.stroke(); g.lineWidth = 1; R(x + 3, C + 4, 2, F - C - 8, 'rgba(255,58,168,0.3)'); }
    if (o.t === 'knockGate') { const y = o.side === 'f' ? MIDY() + 8 : C + 2, pu = 0.6 + 0.4 * Math.sin(S.real * 10); R(x, y, 10, (F - C) / 2 - 10, 'rgba(255,233,160,' + (o.done ? 0.15 : 0.35 * pu) + ')'); R(x, y, 2, (F - C) / 2 - 10, '#ffe9a0'); R(x + 8, y, 2, (F - C) / 2 - 10, '#ffe9a0'); }
  }
}
function hero(A) {
  const y = S.y, x = PX;
  if (S.fly) { // the dotted line shows where you are going
    for (let i = 1; i < 14; i++) { const fx = x + 6 + i * 9, fy = cl(y + 6 + (S.up ? -1 : 1) * 135 * (i * 9 / A.speed), C + 2, F - 2); R(fx, fy, 2, 2, 'rgba(58,255,232,' + (0.8 - i * 0.05).toFixed(2) + ')'); }
