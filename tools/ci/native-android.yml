# Moved out of .github/workflows while AFC lives in the flipnova repo (a push would build and publish a release
# there). Move it back to .github/workflows/ when AFC has its own repository.
name: native-android
# Builds AFC's native football engine (Google Research Football, as a Godot GDExtension) for Android arm64 and
# publishes libafcgf.android.arm64.so as a release asset. The game's APK is assembled elsewhere.
on:
  push:
    paths: ['native/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the engine and godot-cpp
        run: sh native/prepare.sh deps
      - name: Build for arm64-v8a
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          cmake -S native -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=template_release \
            -DGF_ROOT=$PWD/deps/football/third_party/gfootball_engine -DGODOT_CPP=$PWD/deps/godot-cpp
          cmake --build build --target afcgf -j4
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/libafcgf.so
          cp build/libafcgf.so libafcgf.android.arm64.so
          ls -la libafcgf.android.arm64.so
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=native-${GITHUB_SHA::7}
          gh release create "$TAG" libafcgf.android.arm64.so --title "native $TAG" --notes "arm64 GDExtension built from $GITHUB_SHA" --target "$GITHUB_SHA"
