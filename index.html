<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070926">
<meta name="description" content="FLIPPO — لعبة أركيد بكسل: اقلب الجاذبية وبدّل العالم بضغطة واحدة.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FLIPPO</title>
<!-- b66: challenge links unfurl with a title and picture in WhatsApp / Telegram / Discord -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flippo">
<meta property="og:title" content="Flippo — one tap flips gravity. Can you beat my score?">
<meta property="og:description" content="A pixel gravity-flip runner. No ads, nothing to buy. Play free in your browser.">
<meta property="og:image" content="https://amir2049.github.io/flipnova/store-assets/feature-1024x500.png">
<meta property="og:image:width" content="1024"><meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/cairo.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="320" height="180" aria-label="FLIPPO"></canvas>

    <button id="pauseBtn" class="hidden" aria-label="pause"><span></span><span></span></button>
    <div id="hint" class="hidden"></div>
    <div id="toasts"></div>
    <div id="stageName" class="hidden" dir="rtl"></div>
    <div id="twistBan" class="twistBan hidden" aria-live="polite"></div>
    <div id="weekLast" class="wkLast hidden"><div class="wlCard"><div class="wlT"></div><div class="wlR"></div><div class="wlS"></div><div class="wlN"></div><div class="row"><button class="btn play" data-act="weekLastGo"></button><button class="btn ghost" data-act="weekLastClose"></button></div></div></div>
    <canvas id="wipe" width="320" height="180"></canvas>
    <div id="rotate"><div class="phone"></div><p data-t="rotate"></p></div>

    <!-- HOME (build 36 redesign: one hero, one event slot, three doors, one icon bar) -->
    <section id="home" class="screen">
      <div class="hbFx" aria-hidden="true"><i class="hbScan"></i><i class="hbVig"></i></div>
      <header class="topbar">
        <div class="tbStats">
          <div class="chip lvlchip"><b id="lvlTxt">LV 1</b><div class="bar"><i id="lvlBar"></i></div></div>
          <div class="chip coinChip"><span class="coinIcon"></span><b id="homeCoins">0</b></div>
          <div class="chip streakChip hidden" id="streakChip">🔥 <b id="streakN">0</b></div>
          <div class="chip legendChip hidden">♛ <b data-t="legendTitle"></b></div>
        </div>
        <nav class="tbIcons">
          <button class="ic langBtn" data-act="langToggle" aria-label="language" id="langBtn"></button>
          <button class="ic" data-act="board" aria-label="scoreboard"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z M7 6H4v1a3 3 0 0 0 3 3 M17 6h3v1a3 3 0 0 1-3 3 M12 13v4 M8 20h8 M9 17h6"/></svg></button>
          <button class="ic" data-act="skins" aria-label="characters"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 11h1 M14 11h1 M10 14q2 2 4 0"/></svg></button>
          <button class="ic" data-act="missionsBox" aria-label="missions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8"/></svg><i class="dot hidden" id="misDot"></i></button>
          <button class="ic" data-act="settings" aria-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1"/></svg></button>
        </nav>
      </header>
      <div class="homeMain">
        <div class="hero">
          <canvas id="logo" width="120" height="44"></canvas>
          <div class="bestline" id="homeBest"></div>
          <button class="vsBanner hidden" id="vsBanner" data-act="vsPlay"><span id="vsBannerT"></span><b data-t="vsBannerGo"></b></button>
          <button class="heroPlay" data-act="play"><span class="hpIcon" aria-hidden="true"></span><span class="hpT"><b data-t="heroPlay"></b><small data-t="endless"></small></span></button>
          <!-- build 37: one door (the Daily Remix keeps its code and save, but has no home entry) -->
          <!-- build 40: the weekly boss and Adventure share one row (boss first = left in English) -->
          <div class="doors">
            <aside id="eventCard" class="eventCard">
          <button class="evCard boss weekBoss mini2" data-act="boss">
            <canvas class="bossArt" id="bossArt" width="76" height="64" aria-hidden="true"></canvas>
            <span class="evTxt">
              <span class="evTag"><span>⚔️</span><span data-t="bossCard"></span><span id="bossWeek"></span></span>
              <small class="evTime" id="bossLeft"></small>
            </span>
            <span class="evTitle" data-t="bossVs"></span>
            <small class="evRank" id="bossStat"></small>
            <small class="evRank bossRw" id="bossRw"></small>
            <span class="evGo" data-t="evGo"></span>
          </button>
        </aside>
            <button class="door adv" data-act="camp"><svg viewBox="0 0 24 24"><path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z M9 4v14 M15 6v14"/></svg><span><b data-t="adventure"></b><small id="campStars"></small></span></button>
          </div>
        </div>
      </div>
      <!-- 🗓 build 38: a lighter home. The weekly boss duel is a small, tidy card at the bottom-left, next to the mini buttons -->
      <div class="homeFoot">
        <div class="minis">
          <button class="mini maker" data-act="levels"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L15 5l4 4L9 19z M13 7l4 4"/></svg><span data-t="maker"></span></button>
          <button class="mini zen" data-act="zen"><svg viewBox="0 0 24 24"><path d="M5 19C5 10 11 5 20 4c0 9-5 15-14 15 M5 19l8-8"/></svg><span data-t="zen"></span></button>
          <button class="updBtn hidden" id="updBtn"><span data-t="updNew"></span><small></small></button>
        </div>
      </div>
      <div class="credit homeCredit" data-t="credit"></div>
    </section>

    <!-- PAUSE -->
    <section id="pause" class="screen hidden">
      <h2 data-t="paused"></h2>
      <button class="btn big" data-act="resume" data-t="resume"></button>
      <button class="btn" data-act="restart" data-t="restart"></button>
      <button class="btn" data-act="settings" data-t="settings"></button>
      <button class="btn ghost" data-act="home" data-t="home"></button>
    </section>

    <!-- GAME OVER / RESULTS -->
    <section id="over" class="screen hidden">
      <div class="col overL">
        <h2 id="overTitle"></h2>
        <div id="overStars" class="stars hidden"></div>
        <div class="bigscore" id="overScore">0</div>
        <div class="sub" id="overBest"></div>
        <div class="sub overMis" id="overMis"></div>
        <div class="chips" id="overStats"></div>
        <div class="why" id="overWhy"></div>
        <div class="goal" id="overGoal"></div>
        <div class="row">
          <button class="btn big pulse" data-act="again" data-t="again"></button>
          <button class="btn vsBtn hidden" id="overVs" data-act="vsShare"></button>
        </div>
        <small class="tapAny" data-t="tapAny"></small>
      </div>
      <div class="col overR">
        <div class="boardTitle" data-t="board"></div>
        <div class="miniBoard" id="overBoard"></div>
        <div class="xpline" id="overXp"></div>
        <div class="row iconrow">
          <button class="ic big" data-act="home" aria-label="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7 M6 10v10h12V10"/></svg></button>
          <button class="ic big" data-act="share" aria-label="share"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4 M8.2 13l7.6 4"/></svg></button>
          <button class="ic big hidden" id="overReplay" data-act="deathReplay" aria-label="replay"><svg viewBox="0 0 24 24"><path d="M11 6L4 12l7 6z M20 6l-7 6 7 6z"/></svg></button><button class="ic big hidden" id="overClip" data-act="shareClip" aria-label="clip"><svg viewBox="0 0 24 24"><path d="M3 6h13v12H3z M16 10l5-3v10l-5-3z"/></svg></button>
          <button class="ic big hidden" id="overRetry" data-act="retry" aria-label="retry"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5 M5 4v4h4"/></svg></button>
          <button class="ic big hidden" id="overMap" data-act="camp" aria-label="map"><svg viewBox="0 0 24 24"><path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z M9 4v14 M15 6v14"/></svg></button>
          <button class="ic big hidden" id="overEdit" data-act="backToEditor" aria-label="editor"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L15 5l4 4L9 19z M13 7l4 4"/></svg></button>
        </div>
      </div>
    </section>

    <!-- ADVENTURE MAP -->
    <section id="camp" class="screen hidden">
      <div class="campHead">
        <button class="ic" data-act="home" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2 data-t="adventure"></h2>
        <div class="chip"><b id="campTotal">★ 0</b></div>
      </div>
      <div class="campList" id="campList"></div>
    </section>

    <!-- 📖 b44: THE STORY, in order: the prologue, then one chapter per boss -->

    <!-- SCOREBOARD -->
    <section id="board" class="screen hidden">
      <div class="scrHead"><button class="ic back" data-act="home" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="board"></h2></div>
      <div class="tabs" id="boardTabs">
        <button class="tab on" data-btab="world">🌍 <span data-t="bWorld"></span></button>
        <button class="tab" data-btab="worldDaily">🌍 <span data-t="bToday"></span></button>
        <button class="tab" data-btab="friends">👥 <span data-t="bFriends"></span></button>
        <button class="tab" data-btab="runs" data-t="bMine"></button>
        <button class="tab" data-btab="ach" data-t="ach"></button>
      </div>
      <div class="boardStatus" id="boardStatus"></div>
      <div class="nameRow"><span data-t="yourName"></span><input id="playerName" maxlength="14" spellcheck="false"><button class="btn small" id="nameSave" data-t="nameSave"></button></div>
      <p class="note nameStatus hidden" id="nameStatus"></p>
      <div class="list" id="boardList"></div>
    </section>

    <!-- MISSIONS -->
    <section id="missionsBox" class="screen hidden">
      <div class="scrHead"><button class="ic back" data-act="home" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="missions"></h2></div>
      <div class="missions" id="missions"></div>
      <p class="note" data-t="missionsNote"></p>
    </section>

    <!-- SKINS -->
    <section id="skins" class="screen hidden">
      <div class="scrHead"><button class="ic back" data-act="home" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="skins"></h2><div class="sub" id="skinCount"></div><div class="chip wallet"><span class="coinIcon"></span><b id="skinCoins">0</b></div></div>
      <div class="tabs seg"><button class="tab on" data-tab="chars" data-t="chars"></button><button class="tab" data-tab="trails" data-t="trails"></button></div>
      <div class="grid" id="skinGrid"></div>
      <p class="note" data-t="fairNote"></p>
    </section>

    <!-- ACHIEVEMENTS -->
    <section id="ach" class="screen hidden">
      <div class="scrHead"><button class="ic back" data-act="home" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="ach"></h2></div>
      <div class="list" id="achList"></div>
    </section>


    <!-- HOW TO -->
    <section id="howto" class="screen hidden">
      <div class="scrHead"><button class="ic back" data-act="home" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="howto"></h2></div>
      <div class="list howto" id="howtoList"></div>
      <div class="row"><button class="btn" data-act="tutorial" data-t="tutBtn"></button></div>
    </section>

    <!-- MY LEVELS -->
    <section id="levels" class="screen hidden">
      <div class="scrHead"><button class="ic back" data-act="home" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="maker"></h2></div>
      <div class="row">
        <button class="btn big" data-act="newLevel" data-t="newLevel"></button>
        <button class="btn" data-act="importLevel" data-t="importLevel"></button>
      </div>
      <div class="list" id="levelList"></div>
    </section>

    <!-- EDITOR (overlay bars; the level is drawn on the game canvas) -->
    <section id="editor" class="hidden">
      <div class="edTop">
        <button class="eb" data-ed="exit">✕</button>
        <input id="edName" maxlength="20" spellcheck="false">
        <button class="eb" data-ed="world" id="edWorld"></button>
        <button class="eb" data-ed="speed" id="edSpeed"></button>
        <button class="eb" data-ed="undo">↶</button>
        <button class="eb" data-ed="clear">🗑</button>
        <button class="eb ok" data-ed="verify" id="edVerify">✓</button>
        <button class="eb" data-ed="testHere">▶︎<small data-t="here"></small></button>
        <button class="eb go" data-ed="test">▶︎</button>
        <button class="eb save" data-ed="save">💾</button>
      </div>
      <input type="range" id="edScroll" min="0" max="1000" value="0" aria-label="scroll">
      <button class="edArrow left" data-scroll="-1">◀</button>
      <button class="edArrow right" data-scroll="1">▶</button>
      <div class="edMsg" id="edMsg"></div>
      <div class="edTools" id="edTools"></div>
    </section>

    <!-- IMPORT / SHARE CODE -->
    <section id="codeBox" class="screen hidden">
      <h2 id="codeTitle"></h2>
      <p class="note" id="codeNote"></p>
      <textarea id="codeText" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn big" id="codeOk"></button>
        <button class="btn ghost" data-act="codeBack" data-t="back"></button>
      </div>
    </section>

    <section id="stageMaker" class="screen hidden">
      <div class="smSide">
        <h3 id="smTitle"></h3>
        <p class="note smState" id="smState"></p>
        <div class="smList" id="smList"></div>
        <div class="smSideBtns" id="smSideBtns"></div>
        <div class="smPublish hidden" id="smPublish"></div>
      </div>
      <div class="smMain" id="smMain"></div>
    </section>

    <section id="settings" class="screen hidden">
      <div class="scrHead"><button class="ic back" data-act="settingsBack" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="settings"></h2></div>
      <div class="list" id="setList"></div>
      <div class="row">
        <button class="btn" data-act="howto" data-t="howto"></button>
        <button class="btn ghost" data-act="redeem" data-t="redeem"></button>
        <button class="btn ghost" data-act="privacy" data-t="privacy"></button>
      </div>
      <p class="credit" data-t="creditLong"></p>
    </section>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/worlds.js"></script>
<script src="js/stages.js"></script>
<script src="js/homebg.js"></script>
<script src="js/level.js"></script>
<script src="js/campaign.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/bossworld.js"></script>
<script src="js/boss.js"></script>
<script src="js/boss-niro.js"></script>
<script src="js/hdart.js"></script>
<script src="js/hdboss.js"></script>
<script src="js/fairness.js"></script>
<script src="js/editor.js"></script>
<script src="js/online-config.js"></script>
<script src="js/online.js"></script>
<script src="js/screen.js"></script>
<script src="js/ui.js"></script>
<script src="js/stagemaker.js"></script>
<script src="js/main.js"></script>
</body>
</html>
