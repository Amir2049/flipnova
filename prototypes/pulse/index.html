<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FLIPNOVA Pulse prototype</title>
<style>
  :root { --bg: #070926; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
// THROWAWAY PROTOTYPE (17 Nov 2026). One question: does a steady rhythm where EVERY hazard needs a tap
// (~1 tap/s rising), score = seconds survived and an instant retry, make the gravity flip fun?
// Not part of the game. Hard-coded on purpose.
'use strict';
const W = 320, H = 180, C = 36, F = 156, PX = 64, PS = 12;
const G = 2600, MAXV = 460, KICK = 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

let tempo = +(localStorage.getItem('pulseTempo') || 1); // starting taps per second: 0.7 / 1 / 1.3
let best = +(localStorage.getItem('pulseBest' + tempo) || 0);
let S;

function newRun() {
  S = { t: 0, y: F - PS, vy: 0, grav: 1, ground: true, dead: false, deadT: 0, haz: [], rings: [], pops: [], parts: [],
    genX: 360, side: 'floor', taps: [], perfects: 0, flips: 0, streak: 0, shake: 0, freeze: 0, flash: 0, zoom: 0, newBest: false };
}
// rhythm: the interval between needed taps shrinks over time; speed rises so the spacing still reads
const interval = (t) => Math.max(0.42, (1 / tempo) * Math.pow(0.985, t));
const speed = (t) => Math.min(300, 120 + t * 2.2);

function gen() {
  // every hazard sits on the surface you'll be on if you answered the one before: each one is a tap
  while (S.genX < S.dist + W + 80) {
    const v = speed(S.t + (S.genX - S.dist) / speed(S.t)), I = interval(S.t + (S.genX - S.dist) / v);
    const r = Math.random();
    let gap = I * v, len = 8 + Math.floor(Math.random() * 3) * 8;
    if (S.t > 6 && r < 0.18) gap = I * v * 0.55;        // double time: two quick ones
    else if (r > 0.9) { gap = I * v * 1.6; len = 40; }   // a long one, then a short rest
    S.haz.push({ x: S.genX, w: len, side: S.side });
    S.side = S.side === 'floor' ? 'ceil' : 'floor';
    S.genX += Math.max(gap, len + 0.36 * v); // never closer than a human can tap twice (~0.36 s incl. flight)
  }
}

// ---------- sound: clicks and noise only (FLIPNOVA rule: no music, no tones)
let AC = null;
function noise(dur, gain, hp) {
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'highpass'; f.frequency.value = hp; g.gain.value = gain;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}

function tap() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (S.dead) {
    if (S.deadT < 0.25) return;
    // tempo buttons on the death screen
    if (lastPt && lastPt.y > 120) {
      const opts = [0.7, 1, 1.3], i = Math.floor((lastPt.x - 70) / 60);
      if (i >= 0 && i < 3 && lastPt.x > 70 && lastPt.x < 250) { tempo = opts[i]; localStorage.setItem('pulseTempo', tempo); best = +(localStorage.getItem('pulseBest' + tempo) || 0); }
    }
    newRun(); return;
  }
  // PERFECT: the hazard on your surface was about to touch you (within 0.15 s)
  const v = speed(S.t), mySide = S.grav > 0 ? 'floor' : 'ceil';
  let perfect = false;
  for (const h of S.haz) {
    const sx = h.x - S.dist;
    if (h.side === mySide && sx + h.w > PX && sx < PX + PS + v * 0.15 && sx >= PX + PS - 2) { perfect = S.ground; break; }
  }
  S.grav = -S.grav; S.vy = KICK * S.grav; S.ground = false; S.flips++;
  S.taps.push(S.t);
  noise(0.05, 0.25, 2500);
  if (perfect) {
    S.perfects++; S.streak++;
    const lvl = Math.min(S.streak, 5);
    S.rings.push({ x: PX + 6, y: S.y + 6, t: 0, r: 22 + lvl * 6, c: lvl >= 3 ? '#ffffff' : '#7dffb2' });
    S.pops.push({ txt: S.streak > 1 ? 'PERFECT x' + S.streak : 'PERFECT', t: 0, c: '#7dffb2' });
    S.freeze = 0.035; S.zoom = 0.16; S.shake = Math.max(S.shake, 0.06 + lvl * 0.015);
    noise(0.09, 0.35, 5000);
    try { navigator.vibrate && navigator.vibrate(14); } catch (e) {}
  } else { S.streak = 0; try { navigator.vibrate && navigator.vibrate(5); } catch (e) {} }
}

let lastPt = null;
function pt(e) { const r = cv.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H), ox = (r.width - W * s) / 2, oy = (r.height - H * s) / 2; return { x: (e.clientX - r.left - ox) / s, y: (e.clientY - r.top - oy) / s }; }
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); lastPt = pt(e); tap(); });
addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); lastPt = null; tap(); } });

function die() {
  S.dead = true; S.deadT = 0; S.shake = 0.35; S.flash = 1; S.freeze = 0.08;
  noise(0.35, 0.5, 120);
  for (let i = 0; i < 26; i++) { const a = Math.random() * 6.28, s = 40 + Math.random() * 110; S.parts.push({ x: PX + 6, y: S.y + 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0 }); }
  if (S.t > best) { best = S.t; S.newBest = true; localStorage.setItem('pulseBest' + tempo, best.toFixed(2)); }
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
}

function step(dt) {
  S.shake = Math.max(0, S.shake - dt); S.flash = Math.max(0, S.flash - dt * 5); S.zoom = Math.max(0, S.zoom - dt);
  for (const r of S.rings) r.t += dt; S.rings = S.rings.filter((r) => r.t < 0.32);
  for (const p of S.pops) p.t += dt; S.pops = S.pops.filter((p) => p.t < 0.6);
  for (const p of S.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; } S.parts = S.parts.filter((p) => p.t < 0.7);
  if (S.freeze > 0) { S.freeze -= dt; return; }
  if (S.dead) { S.deadT += dt; return; }
  S.t += dt;
  const v = speed(S.t);
  S.dist = (S.dist || 0) + v * dt;
  gen();
  S.vy = Math.max(-MAXV, Math.min(MAXV, S.vy + G * S.grav * dt));
  S.y += S.vy * dt;
  if (S.y >= F - PS) { if (!S.ground && S.grav > 0) S.land = 0.1; S.y = F - PS; S.vy = 0; S.ground = S.grav > 0; }
  if (S.y <= C) { if (!S.ground && S.grav < 0) S.land = 0.1; S.y = C; S.vy = 0; S.ground = S.grav < 0; }
  for (const h of S.haz) {
    const sx = h.x - S.dist, hy = h.side === 'floor' ? F - 9 : C, hh = 9;
    if (sx < PX + PS - 2 && sx + h.w > PX + 2 && S.y + PS - 2 > hy && S.y + 2 < hy + hh) { die(); return; }
  }
  S.haz = S.haz.filter((h) => h.x - S.dist + h.w > -20);
}

function draw() {
  ctx.save();
  ctx.fillStyle = '#070926'; ctx.fillRect(0, 0, W, H);
  if (S.shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 14 * S.shake), Math.round((Math.random() - 0.5) * 14 * S.shake));
  if (S.zoom > 0) { const z = 1 + 0.05 * Math.sin((S.zoom / 0.16) * Math.PI), zx = PX + 6, zy = S.y + 6; ctx.translate(zx, zy); ctx.scale(z, z); ctx.translate(-zx, -zy); }
  const ph = S.grav > 0 ? '#27d7ff' : '#b45cff';
  // lane + scrolling grid so speed reads
  ctx.fillStyle = 'rgba(39,215,255,0.04)'; ctx.fillRect(0, C, W, F - C);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  const off = (S.dist || 0) % 24; for (let x = -off; x < W; x += 24) ctx.fillRect(Math.round(x), C, 1, F - C);
  ctx.fillStyle = ph; ctx.fillRect(0, F, W, 2); ctx.fillRect(0, C - 2, W, 2);
  // hazards: red spikes
  for (const h of S.haz) {
    const sx = Math.round(h.x - S.dist);
    if (sx > W || sx + h.w < 0) continue;
    ctx.fillStyle = '#ff3355';
    for (let i = 0; i < h.w; i += 8) {
      ctx.beginPath();
      if (h.side === 'floor') { ctx.moveTo(sx + i, F); ctx.lineTo(sx + i + 4, F - 10); ctx.lineTo(sx + i + 8, F); }
      else { ctx.moveTo(sx + i, C); ctx.lineTo(sx + i + 4, C + 10); ctx.lineTo(sx + i + 8, C); }
      ctx.fill();
    }
  }
  // player: FLIPPO's red-orange cube with eyes
  if (!S.dead) {
    const sq = S.ground ? 0 : 2, y = Math.round(S.y);
    ctx.fillStyle = '#ff5a3c'; ctx.fillRect(PX - sq / 2, y + sq / 2, PS + sq, PS - sq);
    ctx.fillStyle = '#ffffff'; const ey = S.grav > 0 ? y + 3 : y + 6;
    ctx.fillRect(PX + 3, ey, 2, 3); ctx.fillRect(PX + 7, ey, 2, 3);
  }
  for (const p of S.parts) { ctx.globalAlpha = 1 - p.t / 0.7; ctx.fillStyle = p.t < 0.2 ? '#ffffff' : '#ff5a3c'; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
  ctx.globalAlpha = 1;
  for (const r of S.rings) { const k = r.t / 0.32, e = 1 - (1 - k) * (1 - k); ctx.strokeStyle = r.c; ctx.globalAlpha = 1 - k; ctx.lineWidth = Math.max(1, Math.round(3 * (1 - k))); ctx.beginPath(); ctx.arc(r.x, r.y, 4 + e * r.r, 0, 6.283); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.lineWidth = 1;
  ctx.restore();
  if (S.flash > 0) { ctx.fillStyle = 'rgba(255,51,85,' + (0.3 * S.flash) + ')'; ctx.fillRect(0, 0, W, H); }

  // HUD: the score IS the time
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace';
  ctx.fillText(S.t.toFixed(2), W / 2, 26);
  ctx.font = '8px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('BEST ' + best.toFixed(2), W / 2, 176);
  for (const p of S.pops) { ctx.globalAlpha = 1 - p.t / 0.6; ctx.fillStyle = p.c; ctx.font = 'bold 10px monospace'; ctx.fillText(p.txt, PX + 40, (S.grav > 0 ? F - 30 : C + 36) - p.t * 12); }
  ctx.globalAlpha = 1;
  // debug: what we're judging
  const recent = S.taps.filter((x) => x > S.t - 10).length / Math.min(10, Math.max(1, S.t));
  ctx.textAlign = 'left'; ctx.font = '7px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('taps/s ' + recent.toFixed(2) + '  beat ' + interval(S.t).toFixed(2) + 's  tempo ' + tempo, 4, 10);

  if (S.dead && S.deadT > 0.25) {
    ctx.fillStyle = 'rgba(7,9,38,0.72)'; ctx.fillRect(0, 40, W, 112);
    ctx.textAlign = 'center'; ctx.fillStyle = S.newBest ? '#ffd23f' : '#ffffff'; ctx.font = 'bold 20px monospace';
    ctx.fillText(S.t.toFixed(2) + 's', W / 2, 74);
    ctx.font = '9px monospace'; ctx.fillStyle = S.newBest ? '#ffd23f' : 'rgba(255,255,255,0.7)';
    ctx.fillText(S.newBest ? 'NEW BEST!' : 'BEST ' + best.toFixed(2) + '   PERFECT ' + S.perfects + '/' + S.flips, W / 2, 92);
    ctx.fillStyle = '#7dffb2'; ctx.fillText('TAP ANYWHERE = AGAIN', W / 2, 112);
    [0.7, 1, 1.3].forEach((o, i) => {
      const x = 70 + i * 60; ctx.fillStyle = o === tempo ? '#27d7ff' : 'rgba(255,255,255,0.15)'; ctx.fillRect(x + 4, 124, 52, 18);
      ctx.fillStyle = o === tempo ? '#070926' : '#ffffff'; ctx.fillText('TEMPO ' + o, x + 30, 136);
    });
  }
}

newRun();
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  while (dt > 0) { const s = Math.min(dt, 1 / 120); step(s); dt -= s; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__pulse = { get S() { return S; }, tap, step, interval, speed, reset: newRun };
</script>
</body>
</html>
